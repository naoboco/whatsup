services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vigie
      POSTGRES_PASSWORD: vigie
      POSTGRES_DB: vigie
    ports: ["5432:5432"]
    volumes: [vigie-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigie"]
      interval: 3s
      retries: 20
volumes:
  vigie-db:
